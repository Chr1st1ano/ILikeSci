<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ILikeSci - Assessment</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Top Navigation Bar (Duolingo-style) -->
    <nav class="top-nav">
      <div class="top-nav-left">
        <div class="brand-small">
          <i class="fa-solid fa-atom pulse text-primary"></i>
          <span class="hide-mobile">ILikeSci</span>
        </div>
      </div>
      
      <div class="top-nav-center">
        <button class="nav-tab" data-view="learn" onclick="window.location.href='index.html'">
          <i class="fa-solid fa-book-open"></i>
          <span class="hide-mobile">Learn</span>
        </button>
        <button class="nav-tab active" data-view="practice" onclick="window.location.href='assessment.html'">
          <i class="fa-solid fa-dumbbell"></i>
          <span class="hide-mobile">Practice</span>
        </button>
        <button class="nav-tab" data-view="leaderboard" onclick="window.location.href='scoreboard.html'">
          <i class="fa-solid fa-trophy"></i>
          <span class="hide-mobile">Leaderboard</span>
        </button>
      </div>

      <div class="top-nav-right">
        <div class="user-avatar-small" onclick="window.location.href='profile.html'"></div>
        <button class="btn-icon" onclick="app.toggleTheme()" title="Toggle Theme">
          <i class="fa-solid fa-moon" id="theme-icon"></i>
        </button>
        <button class="btn-icon" onclick="app.handleLogout()" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </nav>

    <main class="content-area">
      <section id="view-assessment" class="view-section active">
        <h1>Assessment</h1>
        <p class="subtitle">Recitation and evaluation tools</p>

        <!-- Assessment & Oral Recitation Tool -->
        <div id="tab-flashquiz" class="tab-content active">
          <div class="filter-bar glass-card mt-20">
            <select id="assess-grade" class="form-control" onchange="app.updateAssessmentTopics()"><option value="3">Grade 3</option><option value="4" selected>Grade 4</option><option value="5">Grade 5</option><option value="6">Grade 6</option></select>
            <select id="assess-topic" class="form-control"></select>
          </div>
          <div class="glass-card mt-20">
            <h3>Difficulty</h3>
            <div class="mt-20" style="display:flex; gap:12px; flex-wrap:wrap;">
              <button class="btn btn-diff active" data-diff="Easy" onclick="app.setDifficulty('Easy')">Easy (1pt)</button>
              <button class="btn btn-diff" data-diff="Medium" onclick="app.setDifficulty('Medium')">Medium (3pts)</button>
              <button class="btn btn-diff" data-diff="Hard" onclick="app.setDifficulty('Hard')">Hard (5pts)</button>
            </div>
          </div>
          <div class="glass-card mt-20"><h3>Select Student</h3><div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:20px;"><select id="assess-student" class="form-control" style="flex:1;"></select><button class="btn btn-secondary" onclick="app.suggestStudent()"><i class="fa-solid fa-lightbulb text-warning"></i> Suggest</button><button class="btn btn-primary" onclick="app.openStudentSpinner()"><i class="fa-solid fa-dharmachakra"></i> Spin Wheel</button></div></div>
          <div style="display:flex; gap:12px; margin-top:20px;">
            <button class="btn btn-primary flex-1" onclick="app.startQuizFlash()"><i class="fa-solid fa-play"></i> Start Flash Quiz</button>
            <button class="btn btn-secondary flex-1" onclick="app.openTVDisplay()"><i class="fa-solid fa-display"></i> TV Mode</button>
            <button class="btn btn-secondary" onclick="app.showRubricOnTV()"><i class="fa-solid fa-table-list"></i> Rubric</button>
          </div>
          <div id="assessment-flash" class="flash-screen hidden">
            <div class="flash-header">
              <span class="badge diff-badge" id="flash-diff">Easy</span>
              <span id="flash-student-name">Student Name</span>
              <span id="pts-label" style="font-weight:700; color:var(--success);"></span>
            </div>

            <!-- Countdown Timer Bar -->
            <div class="flash-timer-track">
              <div id="flash-timer-bar" class="flash-timer-bar"></div>
            </div>

            <div class="participation-insight" id="participation-insight" style="padding:10px; background:rgba(59, 130, 246, 0.2); border-radius:8px; margin-bottom:10px; font-size:14px; text-align:center;">
              <i class="fa-solid fa-circle-info"></i> Performance Insight: <span id="participation-text">Ready</span>
            </div>
            <div class="flash-question glass-card">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
                <h2 id="flash-q-text" style="flex:1; margin:0;">Question goes here...</h2>
                <button class="btn btn-secondary btn-sm" onclick="app.speakText(document.getElementById('flash-q-text').textContent)" title="Read Aloud via Text-to-Speech" style="white-space:nowrap;">
                  <i class="fa-solid fa-volume-high text-primary"></i> <span>Read</span>
                </button>
              </div>
              <div id="flash-choices-container" class="choice-cards-grid"></div>
            </div>
            <div class="flash-controls glass-card mt-20">
              <h3>Oral Recitation Rubric</h3>
              <p class="subtitle">Select points based on response quality (1-5)</p>
              <div class="rubric-buttons" style="display:grid; grid-template-columns: repeat(5, 1fr); gap:10px; margin-top:15px;">
                <button class="btn score-btn" onclick="app.recordRubricResult(1)" style="background:#ef4444; color:white; font-weight:700;">1 pt</button>
                <button class="btn score-btn" onclick="app.recordRubricResult(2)" style="background:#f59e0b; color:white; font-weight:700;">2 pts</button>
                <button class="btn score-btn" onclick="app.recordRubricResult(3)" style="background:#3b82f6; color:white; font-weight:700;">3 pts</button>
                <button class="btn score-btn" onclick="app.recordRubricResult(4)" style="background:#8b5cf6; color:white; font-weight:700;">4 pts</button>
                <button class="btn score-btn" onclick="app.recordRubricResult(5)" style="background:#10b981; color:white; font-weight:700;">5 pts</button>
              </div>
              <div class="rubric-labels" style="display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--text-muted);">
                <span>1 - Needs Improvement</span>
                <span>3 - Proficient</span>
                <span>5 - Outstanding</span>
              </div>
              <div style="display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;">
                <button class="btn score-incorrect flex-1" onclick="app.recordQuizResult(false)"><i class="fa-solid fa-xmark"></i> Incorrect (0)</button>
                <button class="btn btn-secondary" onclick="app.showAIHint(document.getElementById('flash-q-text').textContent, state.assessment.topic)" title="AI Study Hint" style="background:rgba(59,130,246,0.2);border:1px solid rgba(59,130,246,0.3);"><i class="fa-solid fa-robot"></i> Hint</button>
                <button class="btn btn-primary flex-1" onclick="app.toggleAssessmentFullscreen()"><i class="fa-solid fa-expand"></i> Fullscreen</button>
                <button class="btn btn-secondary flex-1" onclick="app.cancelQuiz()"><i class="fa-solid fa-stop"></i> Cancel</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <style>
      .hidden {
        display: none !important;
      }
    </style>

  <script src="app.js"></script>
  <script src="mobile-optimizations.js"></script>
  </div>
</body>
</html>
